<!DOCTYPE html>
<html>
<head>
    <title>WebRTC Camera Broadcast</title>
    <style>
        body { text-align: center; font-family: Arial; background: #111; color: white; }
        video { width: 45%; margin: 10px; border-radius: 10px; }
        input, button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>

    <h2>📡 Camera Broadcast (WebRTC)</h2>

    <input id="roomInput" placeholder="Enter Room ID">
    <br>
    <button onclick="createRoom()">Create / Broadcast</button>
    <button onclick="joinRoom()">Join / View</button>

    <br>

    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>

    <script>
        const localVideo = document.getElementById("localVideo");
        const remoteVideo = document.getElementById("remoteVideo");

        let peer;
        let localStream;

        const config = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" }
            ]
        };

        // 🔥 Fake signaling using public WebSocket
        const socket = new WebSocket("wss://demo.piesocket.com/v3/1?api_key=demo&notify_self=1");

        socket.onmessage = async (event) => {
            const data = JSON.parse(event.data);

            if (!peer) return;

            if (data.offer) {
                await peer.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peer.createAnswer();
                await peer.setLocalDescription(answer);

                socket.send(JSON.stringify({ answer }));
            }

            if (data.answer) {
                await peer.setRemoteDescription(new RTCSessionDescription(data.answer));
            }

            if (data.candidate) {
                await peer.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        };

        async function startCamera() {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
        }

        function createPeer() {
            peer = new RTCPeerConnection(config);

            // Send ICE candidates
            peer.onicecandidate = event => {
                if (event.candidate) {
                    socket.send(JSON.stringify({ candidate: event.candidate }));
                }
            };

            // Receive remote stream
            peer.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
            };

            // Add local stream tracks
            localStream.getTracks().forEach(track => {
                peer.addTrack(track, localStream);
            });
        }

        async function createRoom() {
            await startCamera();
            createPeer();

            const offer = await peer.createOffer();
            await peer.setLocalDescription(offer);

            socket.send(JSON.stringify({ offer }));
        }

        async function joinRoom() {
            await startCamera();
            createPeer();
        }
    </script>

</body>
</html>
